[tool.poetry]
name = "automojo-interop"
description = "Automation Mojo - Interop Package"
version = "0.0.1"
authors = []
readme = "README.rst"
license = "LICENSE.txt"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX"
]
keywords = [
    "python"
]
packages = [{include="automojo", from="source/packages"}]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
paramiko = "^3.5.1"
rpyc = "^6.0.1"
psutil = "^7.0.0"
requests = "^2.32.3"
automojo-credentials = { git = "https://github.com/automationmojo/automojo-credentials.git", branch = "main" }
automojo-errors = { git = "https://github.com/automationmojo/automojo-errors.git", branch = "main" }
automojo-foundation = { git = "https://github.com/automationmojo/automojo-foundation.git", branch = "main" }
automojo-networking = { git = "https://github.com/automationmojo/automojo-networking.git", branch = "main" }
automojo-testbase = { git = "https://github.com/automationmojo/automojo-testbase.git", branch = "main" }
automojo-waiting = { git = "https://github.com/automationmojo/automojo-waiting.git", branch = "main" }


[tool.poetry.group.dev.dependencies]

[tool.poetry.group.dbio.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
