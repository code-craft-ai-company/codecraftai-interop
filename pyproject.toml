[project]
name = "codecraftai-interop"
version = "1.5.0"
description = "Code Craft AI - Interop Package"
readme = "README.rst"
license = "LicenseRef-CodeCraftAI-Dual-License"
authors = [{name = "Myron Walker", email = "myron.walker@gmail.com"}]
keywords = [
    "python"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "paramiko>=4.0.0,<5.0.0",
    "rpyc>=6.0.1,<7.0.0",
    "psutil>=7.2.1,<8.0.0",
    "requests>=2.32.3,<3.0.0",
    "click>=8.2.1,<9.0.0",
    "codecraftai-foundations<2.0.0",
    "codecraftai-runtime<2.0.0",
    "codecraftai-credentials<2.0.0",
    "codecraftai-networking<2.0.0",
    "codecraftai-restclient-base<2.0.0",
    "codecraftai-testbase<2.0.0",
    "codecraftai-integration-runtime<2.0.0",
    "codecraftai-this-app<2.0.0",
    "codecraftai-xmodules<2.0.0",
]

[project.scripts]
am-interop = "ccai.interop.cli.am_interop_command:am_interop_root_command"

[tool.poetry]
packages = [{include="ccai", from="source/packages"}]

[tool.poetry.dependencies]
codecraftai-foundations = {source = "codecraftai"}
codecraftai-runtime = {source = "codecraftai"}
codecraftai-credentials = {source = "codecraftai"}
codecraftai-networking = {source = "codecraftai"}
codecraftai-restclient-base = {source = "codecraftai"}
codecraftai-testbase = {source = "codecraftai"}
codecraftai-integration-runtime = {source = "codecraftai"}
codecraftai-this-app = {source = "codecraftai"}
codecraftai-xmodules = {source = "codecraftai"}

[[tool.poetry.source]]
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"
priority = "supplemental"

[[tool.uv.index]]
# Same licensed index as [[tool.poetry.source]]. Listed before PyPI so that
# codecraftai-* packages (direct and transitive) resolve from it; everything
# else falls through to PyPI. Credentials: UV_INDEX_CODECRAFTAI_USERNAME /
# UV_INDEX_CODECRAFTAI_PASSWORD, or `uv auth login`.
name = "codecraftai"
url = "https://code-craft.ai/licensed-repository/simple/"

[tool.ruff.lint]
# Deliberately narrow.  This gate exists for one reason: a bare `except:`
# swallows ConfigurationError and SemanticError, which derive from
# BaseException precisely so that they pass through ordinary handlers and end
# the run.  Catching them hides the original cause behind whatever error
# happens next.  See userguide/10-00-coding-standards.rst, exception-handling
# rules 5-7.  Use `except Exception:` when you mean "any ordinary failure".
select = ["E722"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
